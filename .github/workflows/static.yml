# Deploy the prerendered site to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # This project is built with Bun (bun.lock, bunfig.toml), not npm.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # DEPLOY_TARGET switches vite.config.ts into static-export mode: Nitro off,
      # prerender on, so the SSR app is rendered to real HTML that Pages can serve.
      # PAGES_BASE comes from configure-pages, so it is "/<repo>/" for a project
      # site and "/" for a custom domain — no manual edit needed either way.
      - name: Build
        run: bun run build
        env:
          DEPLOY_TARGET: gh-pages
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Prerendered HTML + client assets. NOT '.' and NOT './dist'.
          path: "./dist/client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
